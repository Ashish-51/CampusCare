<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - CampusCare</title>
  <meta name="description" content="Sign in or register for CampusCare Digital Complaint Management Portal.">
  <!-- Resource Hints: preconnect to CDN origins for faster DNS + TLS handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
                  var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.8rem;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all var(--transition-fast);
    }
    .auth-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .demo-bar {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <span style="font-weight:800; font-size:1.25rem; color:var(--text-primary);">CampusCare</span>
        </div>
        <button class="theme-toggle-btn"><i class="fa-solid fa-moon"></i></button>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-target="login-form"><i class="fa-solid fa-lock"></i> Sign In</button>
        <button class="auth-tab-btn" data-target="register-form"><i class="fa-solid fa-user-plus"></i> Register (Student)</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="form-control" placeholder="name@campus.edu" required />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">Password</label>
            <button type="button" id="forgot-password-btn" style="background:none; border:none; color:var(--primary); font-size:0.82rem; font-weight:700; cursor:pointer; text-decoration:none; transition:opacity 0.2s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
              <i class="fa-solid fa-key" style="font-size:0.75rem;"></i> Forgot Password?
            </button>
          </div>
          <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Sign In <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <!-- Student Registration Form -->
      <form id="register-form" class="auth-form" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" name="fullName" class="form-control" placeholder="Alex Morgan" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Institutional Email</label>
          <input type="email" id="reg-email" name="email" class="form-control" placeholder="alex@campus.edu" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="At least 6 characters" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-dept">Department</label>
          <select id="reg-dept" name="department" class="form-select" required>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Electrical & Electronics">Electrical & Electronics</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
            <option value="Business Administration">Business Administration</option>
            <option value="General Science">General Science</option>
          </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <div class="form-group">
            <label class="form-label" for="reg-roll">Roll / ID No.</label>
            <input type="text" id="reg-roll" name="rollNumber" class="form-control" placeholder="CS2026-042" />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone No.</label>
            <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="+1 555-0192" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-color); text-align:center; font-size:0.85rem; color:var(--text-muted);">
        Are you a staff member? <a href="./admin/register.html" style="color:var(--primary); font-weight:700;"><i class="fa-solid fa-shield-halved"></i> Register Admin Account</a>
      </div>

    </div>
  </div>

  <!-- Password Reset Modal Overlay -->
  <div class="modal-overlay" id="forgot-password-modal" style="display:none;">
    <div class="modal" style="max-width:440px;">
      <div class="modal-header">
        <h3 style="font-size:1.1rem; font-weight:700;"><i class="fa-solid fa-paper-plane" style="color:var(--primary);"></i> Reset Password</h3>
        <button type="button" class="close-modal-btn" id="close-reset-modal">✕</button>
      </div>

      <form id="reset-password-form">
        <div class="modal-body">
          <div style="background:var(--primary-light); color:var(--primary); padding:0.85rem; border-radius:var(--radius-md); font-size:0.85rem; line-height:1.5; margin-bottom:1.25rem;">
            <i class="fa-solid fa-circle-info"></i> Enter your registered institutional email below. We will send a secure password reset link directly to your inbox.
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-email">Registered Email Address *</label>
            <input type="email" id="reset-email" name="resetEmail" class="form-control" placeholder="name@campus.edu" required />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancel-reset-btn">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/controllers/login.controller.js"></script>
</body>
</html>
