<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CampusCare</title>
  <meta name="description" content="Register for CampusCare Digital Complaint Management Portal.">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
                  var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <span style="font-weight:800; font-size:1.25rem; color:var(--text-primary);">CampusCare</span>
        </div>
        <button class="theme-toggle-btn"><i class="fa-solid fa-moon"></i></button>
      </div>

      <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:0.3rem;">Student Registration</h2>
      <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1.5rem;">Create your student account to lodge facility issues.</p>

      <!-- Student Registration Form -->
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" name="fullName" class="form-control" placeholder="Alex Morgan" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Institutional Email</label>
          <input type="email" id="reg-email" name="email" class="form-control" placeholder="alex@campus.edu" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="At least 6 characters" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-dept">Department</label>
          <select id="reg-dept" name="department" class="form-select" required>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Electrical & Electronics">Electrical & Electronics</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
            <option value="Business Administration">Business Administration</option>
            <option value="General Science">General Science</option>
          </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <div class="form-group">
            <label class="form-label" for="reg-roll">Roll / ID No.</label>
            <input type="text" id="reg-roll" name="rollNumber" class="form-control" placeholder="CS2026-042" />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone No.</label>
            <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="+1 555-0192" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account <i class="fa-solid fa-arrow-right"></i></button>

        <div style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:var(--text-muted);">
          Already have an account? <a href="./login.html" style="font-weight:700;">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/controllers/login.controller.js"></script>
</body>
</html>
