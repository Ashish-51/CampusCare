<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Complaints - CampusCare Admin</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon"><i class="fa-solid fa-building-shield"></i></div>
        <span class="sidebar-brand">CampusCare Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">Workspace</div>
        <a href="./dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-line"></i> Analytics Dashboard
        </a>
        <a href="./complaints.html" class="nav-item active">
          <i class="fa-solid fa-folder-closed"></i> Manage Complaints
        </a>
        
        <div class="nav-group-title">Feedback</div>
        <a href="./feedback.html" class="nav-item">
          <i class="fa-solid fa-star-half-stroke"></i> Student Ratings
        </a>
        
        <div class="nav-group-title">Account</div>
        <a href="./profile.html" class="nav-item">
          <i class="fa-solid fa-user-gear"></i> Admin Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm logout-btn" style="width:100%; color:#94a3b8; border-color:rgba(255,255,255,0.08);">
          <i class="fa-solid fa-right-from-bracket"></i> Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-navbar">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button class="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="navbar-title">
            <h1>Master Complaints Database</h1>
          </div>
        </div>
        <div class="navbar-actions">
          <button type="button" class="btn btn-outline btn-sm" id="export-csv-btn" title="Export to CSV">
            <i class="fa-solid fa-file-arrow-down"></i> Export Report
          </button>
          <button class="theme-toggle-btn"><i class="fa-solid fa-moon"></i></button>
        </div>
      </header>

      <div class="page-body">
        
        <!-- Filter & Search Controls -->
        <div class="filter-bar">
          <div class="filter-inputs">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input type="text" id="search-input" class="form-control" placeholder="Search by Ticket ID, Title, Student Name, Student ID, Dept..." />
            </div>

            <select id="status-filter" class="form-select" style="max-width:145px;">
              <option value="ALL">All Statuses</option>
              <option value="Submitted">Submitted</option>
              <option value="Assigned">Assigned</option>
              <option value="Accepted">Accepted</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
              <option value="Rejected">Rejected</option>
              <option value="Reopened">Reopened</option>
            </select>

            <select id="category-filter" class="form-select" style="max-width:145px;">
              <option value="ALL">All Categories</option>
              <option value="Hostel">Hostel</option>
              <option value="Academics">Academics</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Mess/Catering">Mess / Dining</option>
              <option value="Electrical">Electrical</option>
              <option value="IT/Wifi">IT / Wifi</option>
              <option value="General">General</option>
            </select>

            <select id="urgency-filter" class="form-select" style="max-width:135px;">
              <option value="ALL">All Priorities</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>

            <select id="faculty-filter" class="form-select" style="max-width:160px;">
              <option value="ALL">All Faculty</option>
            </select>
          </div>
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-secondary);" id="results-count">0 records</span>
        </div>

        <!-- Master Complaints Table -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Ticket ID</th>
                <th>Title / Location</th>
                <th>Student / Dept</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Assigned Faculty</th>
                <th>Status</th>
                <th>Triage Action</th>
              </tr>
            </thead>
            <tbody id="admin-complaints-tbody">
              <!-- Dynamically populated by admin-complaints.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Status Triage & Action Modal Overlay -->
  <div class="modal-overlay" id="triage-modal-overlay">
    <div class="modal" style="max-width:480px; border-radius:var(--radius-lg);">
      <div class="modal-header">
        <h3 style="font-family:var(--font-family-display); font-size:1.05rem; font-weight:800;"><i class="fa-solid fa-list-check" style="color:var(--color-brand);"></i> Triage & Assign Complaint</h3>
        <button class="close-modal-btn close-modal-trigger">✕</button>
      </div>

      <form id="triage-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="modal-status-select">Status Lifecycle State *</label>
            <select id="modal-status-select" name="status" class="form-select" required>
              <option value="Submitted">Submitted (Awaiting Assignment)</option>
              <option value="Assigned">Assigned (Assigned to Faculty)</option>
              <option value="Accepted">Accepted by Faculty</option>
              <option value="In Progress">In Progress (Maintenance Active)</option>
              <option value="Resolved">Resolved (Pending Student Review)</option>
              <option value="Closed">Closed (Verified Resolution)</option>
              <option value="Rejected">Rejected (Invalid / Duplicate)</option>
              <option value="Reopened">Reopened (Follow-up Required)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-faculty-select">Assigned Faculty Member</label>
            <select id="modal-faculty-select" name="facultyId" class="form-select">
              <option value="">Unassigned</option>
              <!-- Dynamically populated -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="modal-remarks-input">Admin Remarks & Action Log *</label>
            <textarea id="modal-remarks-input" name="remarks" class="form-control" placeholder="Add specific details for the student and timeline audit trail..." required style="min-height:85px;"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm close-modal-trigger">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk"></i> Save & Log Timeline</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/controllers/admin-complaints.js"></script>
</body>
</html>
